<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLANGE — Dashboard de Incidentes</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #f5f4f1;
            --surface: #ffffff;
            --surface-2: #f0eeea;
            --text: #1a1a1a;
            --text-muted: #6b6b6b;
            --text-hint: #a0a0a0;
            --border: rgba(0,0,0,0.1);
            --border-md: rgba(0,0,0,0.18);
            --radius-md: 8px;
            --radius-lg: 12px;
            --accent: #4A90C4;
            --accent-dark: #3A7AAE;
            --critical: #C0422A;
            --critical-dark: #A3351F;
            --mono: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 24px 20px;
        }

        .container { max-width: 960px; margin: 0 auto; }

        /* ── Header ── */
        .fl-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 1rem;
            border-bottom: 0.5px solid var(--border);
            margin-bottom: 1.5rem;
        }
        .fl-logo { display: flex; align-items: center; gap: 10px; }
        .fl-logo-mark {
            width: 38px; height: 38px;
            background: #B85C2A;
            border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
        }
        .fl-logo-mark span {
            font-family: var(--mono);
            font-size: 11px; font-weight: bold;
            color: #fff; letter-spacing: 1px;
        }
        .fl-title { font-family: var(--mono); font-size: 15px; font-weight: bold; }
        .fl-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
        .fl-badge {
            font-size: 11px; font-family: var(--mono);
            color: var(--text-muted);
            border: 0.5px solid var(--border-md);
            padding: 4px 10px; border-radius: var(--radius-md);
        }

        /* ── KPI Cards ── */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-bottom: 1.75rem;
        }
        .kpi {
            background: var(--surface-2);
            border-radius: var(--radius-md);
            padding: 14px 16px;
            position: relative;
        }
        .kpi-label {
            font-size: 11px; color: var(--text-muted);
            text-transform: uppercase; letter-spacing: 0.05em;
            font-family: var(--mono); margin-bottom: 6px;
        }
        .kpi-value {
            font-family: var(--mono);
            font-size: 28px; font-weight: bold;
            color: var(--text); line-height: 1;
        }
        .kpi-unit { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        .kpi.critical .kpi-value { color: var(--critical); }
        .kpi-icon {
            position: absolute; top: 14px; right: 14px;
            font-size: 18px; color: var(--text-hint);
        }

        /* ── Section Label ── */
        .section-label {
            font-size: 11px; font-family: var(--mono);
            text-transform: uppercase; letter-spacing: 0.07em;
            color: var(--text-muted); margin-bottom: 10px;
            display: flex; align-items: center; gap: 8px;
        }
        .section-label::after {
            content: ''; flex: 1;
            height: 0.5px; background: var(--border);
        }

        /* ── Chart ── */
        .chart-card {
            background: var(--surface);
            border: 0.5px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 1.75rem;
        }
        .legend-row { display: flex; gap: 20px; margin-bottom: 16px; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
        .legend-swatch { width: 10px; height: 10px; border-radius: 2px; }
        .chart-wrap { position: relative; width: 100%; height: 300px; }

        /* ── Location Cards ── */
        .loc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 1.5rem;
        }
        .loc-card {
            background: var(--surface);
            border: 0.5px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 14px 16px;
            transition: border-color 0.15s, transform 0.15s;
        }
        .loc-card:hover { border-color: var(--border-md); transform: translateY(-2px); }
        .loc-card.peak {
            border-left: 3px solid var(--critical);
            border-radius: 0 var(--radius-lg) var(--radius-lg) 0;
        }
        .loc-month {
            font-family: var(--mono); font-size: 11px;
            color: var(--text-muted); text-transform: uppercase;
            letter-spacing: 0.05em; margin-bottom: 6px;
        }
        .loc-place { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 8px; line-height: 1.35; }
        .loc-count {
            display: inline-flex; align-items: center; gap: 5px;
            font-family: var(--mono); font-size: 13px; font-weight: bold;
            color: var(--text-muted);
        }
        .loc-count.peak-count { color: var(--critical); }
        .loc-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

        /* ── Footer ── */
        .footer {
            border-top: 0.5px solid var(--border);
            padding-top: 1rem;
            display: flex; justify-content: space-between; align-items: center;
        }
        .footer-note { font-size: 11px; color: var(--text-hint); font-family: var(--mono); }
    </style>
</head>
<body>
<div class="container">

    <!-- Header -->
    <div class="fl-header">
        <div class="fl-logo">
            <div class="fl-logo-mark"><span>FLG</span></div>
            <div>
                <div class="fl-title">FLANGE</div>
                <div class="fl-subtitle">Dashboard de Incidentes</div>
            </div>
        </div>
        <div class="fl-badge" id="fl-period">Jan – Dez 2025</div>
    </div>

    <!-- KPIs -->
    <div class="kpi-grid">
        <div class="kpi">
            <div class="kpi-label">Total</div>
            <div class="kpi-value" id="kpi-total">0</div>
            <div class="kpi-unit">incidentes</div>
        </div>
        <div class="kpi critical">
            <div class="kpi-label">Pico</div>
            <div class="kpi-value" id="kpi-peak">0</div>
            <div class="kpi-unit" id="kpi-peak-month">—</div>
        </div>
        <div class="kpi">
            <div class="kpi-label">Média/mês</div>
            <div class="kpi-value" id="kpi-avg">0</div>
            <div class="kpi-unit">incidentes</div>
        </div>
        <div class="kpi">
            <div class="kpi-label">Locais</div>
            <div class="kpi-value" id="kpi-locs">0</div>
            <div class="kpi-unit">setores ativos</div>
        </div>
    </div>

    <!-- Gráfico -->
    <div class="section-label">Ocorrências mensais</div>
    <div class="chart-card">
        <div class="legend-row">
            <div class="legend-item">
                <span class="legend-swatch" style="background:#4A90C4"></span>Normal
            </div>
            <div class="legend-item">
                <span class="legend-swatch" style="background:#C0422A"></span>Mês crítico
            </div>
        </div>
        <div class="chart-wrap">
            <canvas id="incChart"></canvas>
        </div>
    </div>

    <!-- Cards de Localização -->
    <div class="section-label">Detalhamento por localização</div>
    <div class="loc-grid" id="locGrid"></div>

    <!-- Footer -->
    <div class="footer">
        <span class="footer-note">FLANGE · Relatório gerado automaticamente</span>
        <span class="footer-note" id="fl-ts"></span>
    </div>

</div>

<script>
    // ── Mock Data ──────────────────────────────────────────
    // Substitua este array pela sua fonte de dados real (API, fetch, etc.)
    const data = [
        { mes: "Jan", quantidade: 15, localizacao: "Setor Norte — Almoxarifado" },
        { mes: "Fev", quantidade: 8,  localizacao: "Setor Sul — Estacionamento" },
        { mes: "Mar", quantidade: 24, localizacao: "Prédio Principal — Recepção" },
        { mes: "Abr", quantidade: 42, localizacao: "Filial Leste — Galpão 3" },
        { mes: "Mai", quantidade: 19, localizacao: "Setor Oeste — Refeitório" },
        { mes: "Jun", quantidade: 12, localizacao: "Laboratório Central" },
        { mes: "Jul", quantidade: 31, localizacao: "Setor Norte — Linha de Produção" },
        { mes: "Ago", quantidade: 27, localizacao: "Filial Leste — Galpão 1" },
        { mes: "Set", quantidade: 9,  localizacao: "Setor Sul — Depósito B" },
        { mes: "Out", quantidade: 38, localizacao: "Prédio Principal — Andar 3" },
        { mes: "Nov", quantidade: 22, localizacao: "Setor Oeste — Oficina" },
        { mes: "Dez", quantidade: 14, localizacao: "Laboratório Central — Sala 2" }
    ];
    // ──────────────────────────────────────────────────────

    const maxVal   = Math.max(...data.map(d => d.quantidade));
    const total    = data.reduce((a, d) => a + d.quantidade, 0);
    const avg      = Math.round(total / data.length);
    const peakItem = data.find(d => d.quantidade === maxVal);

    // Animação de contagem nos KPIs
    function animCount(el, target, dur = 900) {
        let start = null;
        const step = ts => {
            if (!start) start = ts;
            const p = Math.min((ts - start) / dur, 1);
            el.textContent = Math.round(p * target);
            if (p < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
    }

    document.addEventListener('DOMContentLoaded', () => {

        // KPIs
        animCount(document.getElementById('kpi-total'), total);
        animCount(document.getElementById('kpi-peak'),  maxVal);
        animCount(document.getElementById('kpi-avg'),   avg);
        animCount(document.getElementById('kpi-locs'),  data.length);
        document.getElementById('kpi-peak-month').textContent = peakItem.mes;
        document.getElementById('fl-ts').textContent =
            new Date().toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', year: 'numeric' });

        // Cores das barras
        const bgColors     = data.map(d => d.quantidade === maxVal ? '#C0422A' : '#4A90C4');
        const borderColors = data.map(d => d.quantidade === maxVal ? '#A3351F' : '#3A7AAE');

        // Gráfico
        new Chart(document.getElementById('incChart'), {
            type: 'bar',
            data: {
                labels: data.map(d => d.mes),
                datasets: [{
                    label: 'Incidentes',
                    data: data.map(d => d.quantidade),
                    backgroundColor: bgColors,
                    borderColor: borderColors,
                    borderWidth: 1,
                    borderRadius: 3
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#1a1a1a',
                        titleColor: '#e0e0e0',
                        bodyColor: '#b0b0b0',
                        padding: 10,
                        callbacks: {
                            label: ctx => `${ctx.parsed.y} incidentes registrados`
                        }
                    }
                },
                scales: {
                    x: {
                        grid: { color: 'rgba(0,0,0,0.05)' },
                        ticks: { font: { family: 'Courier New', size: 12 }, color: '#888', autoSkip: false }
                    },
                    y: {
                        beginAtZero: true,
                        grid: { color: 'rgba(0,0,0,0.05)' },
                        ticks: { font: { family: 'Courier New', size: 12 }, color: '#888', stepSize: 10 }
                    }
                },
                animation: { duration: 800, easing: 'easeOutQuart' }
            }
        });

        // Cards de localização
        const grid = document.getElementById('locGrid');
        grid.innerHTML = data.map(d => {
            const isPeak = d.quantidade === maxVal;
            return `
          <div class="loc-card${isPeak ? ' peak' : ''}">
            <div class="loc-month">${d.mes}${isPeak ? ' · ⚠ Crítico' : ''}</div>
            <div class="loc-place">${d.localizacao}</div>
            <div class="loc-count${isPeak ? ' peak-count' : ''}">
              <span class="loc-dot"></span>${d.quantidade} incidentes
            </div>
          </div>
        `;
        }).join('');
    });
</script>
</body>
</html>
