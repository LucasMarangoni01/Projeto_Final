<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastrar flange | Monitoramento de Flanges</title>

    <link rel="stylesheet"
          th:href="@{/style.css}">

    <link rel="stylesheet"
          th:href="@{/menu.css}">

    <link rel="stylesheet"
          th:href="@{/flange.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
    <link rel="apple-touch-icon" th:href="@{/favicon.svg}">
</head>

<body>

<div th:replace="~{fragments/menu :: menu}"></div>

<main>

    <div class="flange-form-header">

        <span class="flange-label">
            MONITORAMENTO
        </span>

        <h1>
            Cadastrar Flange
        </h1>

        <p>
            Cadastre um flange e associe-o à unidade
            responsável pelo monitoramento.
        </p>

    </div>

    <section class="flange-form-card">

        <div class="flange-error"
             th:if="${erro}"
             th:text="${erro}">
        </div>

        <form
                th:action="@{/flange/salvar}"
                th:object="${flange}"
                method="post"
                enctype="multipart/form-data">

            <div class="form-grid">

                <div class="form-group">

                    <label for="nome_flange">
                        Nome do flange
                    </label>

                    <input
                            type="text"
                            id="nome_flange"
                            th:field="*{nome_flange}"
                            placeholder="Ex.: FL-01"
                            required>

                    <div
                            class="msg-erro"
                            th:if="${#fields.hasErrors('nome_flange')}"
                            th:errors="*{nome_flange}">
                    </div>

                </div>

                <div class="form-group">

                    <label for="localizacao">
                        Localização
                    </label>

                    <input
                            type="text"
                            id="localizacao"
                            th:field="*{localizacao}"
                            placeholder="Ex.: Linha de produção"
                            required>

                    <div
                            class="msg-erro"
                            th:if="${#fields.hasErrors('localizacao')}"
                            th:errors="*{localizacao}">
                    </div>

                </div>

                <div class="form-group">

                    <label for="temp_ambiente">
                        Temperatura ambiente
                    </label>

                    <input
                            type="number"
                            id="temp_ambiente"
                            th:field="*{temp_ambiente}"
                            step="0.1"
                            placeholder="Ex.: 27.5"
                            required>

                    <div
                            class="msg-erro"
                            th:if="${#fields.hasErrors('temp_ambiente')}"
                            th:errors="*{temp_ambiente}">
                    </div>

                </div>

                <div class="form-group">

                    <label for="data_entrada">
                        Data de entrada
                    </label>

                    <input
                            type="date"
                            id="data_entrada"
                            th:field="*{data_entrada}"
                            required>

                    <div
                            class="msg-erro"
                            th:if="${#fields.hasErrors('data_entrada')}"
                            th:errors="*{data_entrada}">
                    </div>

                </div>

                <div class="form-group">
                    <label for="normaTecnica">Norma técnica</label>
                    <input type="text" id="normaTecnica" th:field="*{normaTecnica}"
                           maxlength="80" placeholder="ASME B16.5">
                    <small>Informe a norma aplicável ao componente, conforme especificação técnica.</small>
                </div>

                <div class="form-group">
                    <label for="tipoFlange">Tipo de flange</label>
                    <input type="text" id="tipoFlange" th:field="*{tipoFlange}"
                           maxlength="30" placeholder="Ex.: pescoço, cega, sobreposta">
                </div>

                <div class="form-group">
                    <label for="diametroNominal">Diâmetro nominal</label>
                    <input type="text" id="diametroNominal" th:field="*{diametroNominal}"
                           maxlength="30" placeholder="Ex.: 2 pol / DN 50">
                </div>

                <div class="form-group">
                    <label for="classePressao">Classe de pressão</label>
                    <select id="classePressao" th:field="*{classePressao}">
                        <option value="">Não informada</option>
                        <option th:each="classe : ${classesPressao}" th:value="${classe}"
                                th:text="${classe.descricao}">150#</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="tipoFace">Tipo de face</label>
                    <select id="tipoFace" th:field="*{tipoFace}">
                        <option value="">Não informada</option>
                        <option th:each="face : ${tiposFace}" th:value="${face}"
                                th:text="${face.descricao}">RF</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="materialFabricacao">Material / liga</label>
                    <select id="materialFabricacao" th:field="*{materialFabricacao}">
                        <option value="">Não informado</option>
                        <option th:each="material : ${materiaisFlange}" th:value="${material}"
                                th:text="${material.descricao}">Material</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="tipoJunta">Tipo de junta</label>
                    <select id="tipoJunta" th:field="*{tipoJunta}">
                        <option value="">Não informada</option>
                        <option th:each="junta : ${tiposJunta}" th:value="${junta}"
                                th:text="${junta.descricao}">Junta</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="ultimaInspecaoIntegridade">Última inspeção de integridade</label>
                    <input type="date" id="ultimaInspecaoIntegridade" th:field="*{ultimaInspecaoIntegridade}">
                </div>

                <div class="form-group">
                    <label for="proximaInspecaoIntegridade">Próxima inspeção de integridade</label>
                    <input type="date" id="proximaInspecaoIntegridade" th:field="*{proximaInspecaoIntegridade}">
                </div>

                <div class="form-group">
                    <label for="profissionalHabilitado">Profissional habilitado responsável</label>
                    <input type="text" id="profissionalHabilitado" th:field="*{profissionalHabilitado}"
                           maxlength="120" placeholder="Nome do responsável técnico">
                </div>

                <div class="form-group">
                    <label for="numeroArt">Número da ART</label>
                    <input type="text" id="numeroArt" th:field="*{numeroArt}"
                           maxlength="80" placeholder="Número da ART, se aplicável">
                </div>

                <div class="form-group flange-admin-field"
                     th:if="${ehAdmin}">

                    <label for="unidadeId">
                        Unidade
                    </label>

                    <select
                            id="unidadeId"
                            name="unidadeId"
                            required>

                        <option value="">
                            Selecione uma unidade
                        </option>

                        <option
                                th:each="unidade : ${unidades}"
                                th:value="${unidade.id}"
                                th:text="${unidade.nome}">
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label for="arquivoFoto">
                        Foto do flange
                    </label>

                    <input
                            type="file"
                            id="arquivoFoto"
                            name="arquivoFoto"
                            accept="image/*">

                </div>

            </div>

            <div class="botoes">

                <a
                        th:href="@{/flange/listagem}"
                        class="btn-voltar">
                    Voltar
                </a>

                <button
                        type="submit"
                        class="btn-primary">
                    Cadastrar Flange
                </button>

            </div>

        </form>

    </section>

</main>

<footer>
    <p>
        © 2026 Sistema de Monitoramento de Flanges.
        Todos os direitos reservados.
    </p>
</footer>

<script th:src="@{/menu.js}"></script>

</body>
</html>
