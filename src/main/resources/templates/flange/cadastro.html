<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastrar Flange | Soda Cáustica Flanges</title>

    <link rel="stylesheet"
          th:href="@{/style.css}">

    <link rel="stylesheet"
          th:href="@{/menu.css}">

    <link rel="stylesheet"
          th:href="@{/flange.css}">
</head>

<body>

<div th:replace="~{fragments/menu :: menu}"></div>

<main>

    <div class="flange-form-header">

        <span class="flange-label">
            MONITORAMENTO
        </span>

        <h1>
            Cadastrar Flange
        </h1>

        <p>
            Cadastre um flange e associe-o à unidade
            responsável pelo monitoramento.
        </p>

    </div>

    <section class="flange-form-card">

        <div class="flange-error"
             th:if="${erro}"
             th:text="${erro}">
        </div>

        <form
                th:action="@{/flange/salvar}"
                th:object="${flange}"
                method="post"
                enctype="multipart/form-data">

            <div class="form-grid">

                <div class="form-group">

                    <label for="nome_flange">
                        Nome do flange
                    </label>

                    <input
                            type="text"
                            id="nome_flange"
                            th:field="*{nome_flange}"
                            placeholder="Ex.: FL-01"
                            required>

                    <div
                            class="msg-erro"
                            th:if="${#fields.hasErrors('nome_flange')}"
                            th:errors="*{nome_flange}">
                    </div>

                </div>

                <div class="form-group">

                    <label for="localizacao">
                        Localização
                    </label>

                    <input
                            type="text"
                            id="localizacao"
                            th:field="*{localizacao}"
                            placeholder="Ex.: Linha de produção"
                            required>

                    <div
                            class="msg-erro"
                            th:if="${#fields.hasErrors('localizacao')}"
                            th:errors="*{localizacao}">
                    </div>

                </div>

                <div class="form-group">

                    <label for="temp_ambiente">
                        Temperatura ambiente
                    </label>

                    <input
                            type="number"
                            id="temp_ambiente"
                            th:field="*{temp_ambiente}"
                            step="0.1"
                            placeholder="Ex.: 27.5"
                            required>

                    <div
                            class="msg-erro"
                            th:if="${#fields.hasErrors('temp_ambiente')}"
                            th:errors="*{temp_ambiente}">
                    </div>

                </div>

                <div class="form-group">

                    <label for="data_entrada">
                        Data de entrada
                    </label>

                    <input
                            type="date"
                            id="data_entrada"
                            th:field="*{data_entrada}"
                            required>

                    <div
                            class="msg-erro"
                            th:if="${#fields.hasErrors('data_entrada')}"
                            th:errors="*{data_entrada}">
                    </div>

                </div>

                <div class="form-group flange-admin-field"
                     th:if="${ehAdmin}">

                    <label for="unidadeId">
                        Unidade
                    </label>

                    <select
                            id="unidadeId"
                            name="unidadeId"
                            required>

                        <option value="">
                            Selecione uma unidade
                        </option>

                        <option
                                th:each="unidade : ${unidades}"
                                th:value="${unidade.id}"
                                th:text="${unidade.nome}">
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label for="arquivoFoto">
                        Foto do flange
                    </label>

                    <input
                            type="file"
                            id="arquivoFoto"
                            name="arquivoFoto"
                            accept="image/*">

                </div>

            </div>

            <div class="botoes">

                <a
                        th:href="@{/flange/listagem}"
                        class="btn-voltar">
                    Voltar
                </a>

                <button
                        type="submit"
                        class="btn-primary">
                    Cadastrar Flange
                </button>

            </div>

        </form>

    </section>

</main>

<footer>
    <p>
        © 2026 Sistema de Monitoramento de Flanges.
        Todos os direitos reservados.
    </p>
</footer>

<script th:src="@{/menu.js}"></script>

</body>
</html>
