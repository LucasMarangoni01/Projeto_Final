<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nova Unidade | Soda Cáustica Flanges</title>

    <link rel="stylesheet"
          th:href="@{/style.css}">

    <link rel="stylesheet"
          th:href="@{/menu.css}">

    <link rel="stylesheet"
          th:href="@{/unidade.css}">
</head>

<body>

<div th:replace="~{fragments/menu :: menu}"></div>

<main>

    <div class="unidade-form-header">

        <span class="unidade-label">
            ADMINISTRAÇÃO
        </span>

        <h1>
            Criar Unidade
        </h1>

        <p>
            Cadastre uma nova unidade para organizar
            usuários e operações do sistema.
        </p>

    </div>

    <section class="unidade-form-card">

        <form
                th:action="@{/unidades/salvar}"
                th:object="${unidade}"
                method="post">

            <div class="form-grid">

                <div class="form-group">

                    <label for="nome">
                        Nome da unidade
                    </label>

                    <input
                            type="text"
                            id="nome"
                            th:field="*{nome}"
                            placeholder="Ex.: Unidade Industrial"
                            required>

                    <div
                            class="unidade-error"
                            th:if="${#fields.hasErrors('nome')}"
                            th:errors="*{nome}">
                    </div>

                </div>

                <div class="form-group">

                    <label for="localizacao">
                        Localização
                    </label>

                    <input
                            type="text"
                            id="localizacao"
                            th:field="*{localizacao}"
                            placeholder="Ex.: São Paulo - SP"
                            required>

                    <div
                            class="unidade-error"
                            th:if="${#fields.hasErrors('localizacao')}"
                            th:errors="*{localizacao}">
                    </div>

                </div>

            </div>

            <div class="unidade-form-acoes">

                <a th:href="@{/unidades}"
                   class="unidade-btn unidade-btn-secondary">
                    Voltar
                </a>

                <button
                        type="submit"
                        class="unidade-btn unidade-btn-primary">
                    Criar Unidade
                </button>

            </div>

        </form>

    </section>

</main>

<footer>
    <p>
        © 2026 Sistema de Monitoramento de Flanges.
        Todos os direitos reservados.
    </p>
</footer>

<script th:src="@{/menu.js}"></script>

</body>
</html>
