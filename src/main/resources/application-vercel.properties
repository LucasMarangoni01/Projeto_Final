# Perfil exclusivo da Vercel.
server.port=${PORT:80}
server.address=0.0.0.0
server.forward-headers-strategy=framework
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.session.jdbc.initialize-schema=always
spring.session.jdbc.schema=classpath:sql/spring-session-mysql.sql
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
app.upload.storage=database
app.mqtt.enabled=false
spring.jpa.show-sql=false
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-message=never
# Impede que visitantes assumam a primeira conta ADMIN em banco novo.
app.security.bootstrap-required=true
app.security.bootstrap-key=${APP_SETUP_KEY:}
