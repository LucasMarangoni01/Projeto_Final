# Importa opcionalmente as configurações locais. O arquivo .env não deve ser versionado.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/soda_caustica_flanges?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:soda_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.globally_quoted_identifiers_skip_column_definitions=true

# Porta local usada no ambiente de desenvolvimento.
server.port=80

# Uploads privados de foto de perfil
app.upload.profile-dir=uploads/perfil
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
